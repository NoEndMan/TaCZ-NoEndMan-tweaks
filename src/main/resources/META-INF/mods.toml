modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Adds no packets, registries or items: client and server work without each other.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=true
    versionRange="${tacz_version_range}"
    ordering="AFTER"
    side="BOTH"
# Optional: the upper body twist while flying only runs with Immersive Aircraft.
[[dependencies.${mod_id}]]
    modId="immersive_aircraft"
    mandatory=false
    versionRange="[1.5,)"
    ordering="AFTER"
    side="CLIENT"
# Optional: the twist is applied after EMF animations.
[[dependencies.${mod_id}]]
    modId="entity_model_features"
    mandatory=false
    versionRange="[3.3,)"
    ordering="AFTER"
    side="CLIENT"
# Optional: the twist fades out while a Player Animator animation plays.
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[mixins]]
    config = "${mod_id}.compat.mixins.json"
